unbind r
bind r source-file ~/.tmux.conf

set -g allow-passthrough on
set-option -sg escape-time 10
set-option -g focus-events on
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"

set -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Tokyo Night (night)
set -g status-style "bg=#16161e,fg=#a9b1d6"
set -g status-left "#[bg=#73daca,fg=#1a1b26,bold] #S #[bg=#16161e,fg=#73daca]"
set -g status-left-length 30
set -g status-right "#[fg=#565f89]%H:%M #[fg=#737aa2]%d-%b"
set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[bg=#7aa2f7,fg=#1a1b26,bold] #I:#W "
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#283457,fg=#c0caf5"
set -g mode-style "bg=#283457,fg=#c0caf5"
